<style>
:root{--bg:#f4f3ef;--ink:#161816;--muted:#777974;--white:#fff;--line:#e9e8e3}body.dark{--bg:#151615;--ink:#f2f2ed;--muted:#b1b3ac;--white:#222421;--line:#3b3d38}body.dark .card,body.dark .search,body.dark .filterbtn,body.dark .bottomnav,body.dark .modal{background:#222421;color:var(--ink)}body.dark .navitem{color:var(--ink)}body.dark .form input,body.dark .form select{background:#30322e;color:var(--ink);border-color:#484a44}body.dark .close{background:#393b36;color:#fff}body.dark .bottomnav{background:#222421ed}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:108px}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:720px;margin:0 auto;padding:18px 16px 0}.head{display:flex;justify-content:space-between;align-items:center;margin:8px 0 20px}.head h1{font-size:29px;letter-spacing:-1.1px;margin:0;font-weight:800}.head p{font-size:15px;color:var(--muted);margin:4px 0 0}.iconbtn{border:0;background:transparent;font-size:25px;width:42px;height:42px;border-radius:50%}.searchrow{display:grid;grid-template-columns:70px 1fr;gap:10px;margin-bottom:25px}.filterbtn{border:0;border-radius:18px;background:#fff;display:grid;place-items:center;font-size:24px;box-shadow:0 1px 2px #00000005}.search{background:#fff;border-radius:18px;display:flex;align-items:center;padding:0 15px;gap:10px;min-width:0}.search span{font-size:24px;color:#777}.search input{border:0;outline:0;width:100%;min-width:0;font-size:16px;background:transparent;padding:18px 0}.sectiontitle{display:flex;align-items:center;justify-content:space-between;margin:0 0 16px}.sectiontitle h2{font-size:25px;letter-spacing:-.6px;margin:0}.sectiontitle span{color:var(--muted);font-size:14px}.cards{display:grid;gap:20px}.card{background:#fff;border-radius:24px;overflow:hidden}.photo{height:clamp(220px,70vw,355px);position:relative;background:#dce3d7}.photo img{width:100%;height:100%;object-fit:cover;display:block}.source{position:absolute;bottom:14px;left:14px;background:#485b25e8;color:#fff;padding:9px 13px;border-radius:99px;font-weight:800;font-size:14px}.body{padding:16px 19px 19px}.titleline{display:flex;justify-content:space-between;align-items:center;gap:10px}.titleline h3{font-size:23px;letter-spacing:-.6px;margin:0;font-weight:750;line-height:1.2}.heart{flex:none;background:transparent;border:0;font-size:31px;line-height:1;color:#272927;padding:0 2px}.heart.on{color:#d54b54}.meta{color:var(--muted);font-size:17px;margin:10px 0 13px}.price{font-size:23px;letter-spacing:-.4px;font-weight:650;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px}.price:after{content:"Ətraflı məlumat →";font-size:13px;letter-spacing:0;font-weight:700;color:#536b2d;background:#edf1e6;border-radius:10px;padding:8px 10px;white-space:nowrap}body.dark .price:after{background:#39432d;color:#d8e8b8}.bottomnav{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(660px,calc(100% - 32px));background:#fffffff0;backdrop-filter:blur(16px);border-radius:27px;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;padding:12px 10px;box-shadow:0 8px 35px #0000000b;z-index:3}.navitem{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#30322f;font-size:14px;line-height:1.25;min-height:62px}.navicon{font-size:28px}.addbtn{width:76px;height:76px;border-radius:50%;background:#111;color:white;border:0;font-size:42px;font-weight:300;align-self:center;justify-self:center;margin-top:-20px;box-shadow:0 3px 12px #00000013}.modalbg{display:none;position:fixed;inset:0;background:#0008;z-index:5;align-items:flex-end;justify-content:center;padding:12px}.modalbg.show{display:flex}.modal{background:#fff;border-radius:25px 25px 20px 20px;padding:22px;width:min(600px,100%);max-height:85vh;overflow:auto}.modalhead{display:flex;align-items:center;justify-content:space-between}.modal h2{margin:0;font-size:23px}.close{border:0;background:#f1f1ed;border-radius:50%;width:38px;height:38px;font-size:24px}.form{display:grid;gap:12px;margin-top:18px}.form label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);background:#fafaf8;border-radius:12px;padding:13px}.submit{background:#171917;color:#fff;border:0;border-radius:14px;padding:15px;font-weight:750}.filtergrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.empty{text-align:center;padding:35px;color:var(--muted)}.info-list{display:grid;gap:10px;margin-top:16px}.info-item{border:1px solid var(--line);border-radius:14px;background:var(--white);overflow:hidden}.info-item summary{list-style:none;cursor:pointer;padding:15px 16px;font-weight:750;display:flex;align-items:center;justify-content:space-between;gap:12px}.info-item summary::-webkit-details-marker{display:none}.info-item summary:after{content:"＋";font-size:20px;color:var(--muted)}.info-item[open] summary:after{content:"−"}.info-copy{padding:0 16px 16px;line-height:1.6;color:var(--muted);font-size:14px}.info-copy p{margin:8px 0}.info-copy ul{padding-left:20px;margin:8px 0}.settings-divider{height:1px;background:var(--line);margin:18px 0}
.detail-photo{width:100%;max-height:340px;object-fit:cover;border-radius:16px;margin-top:16px}.detail-text{line-height:1.65;color:var(--ink);margin:12px 0}.detail-actions{display:flex;gap:10px;margin-top:12px}.detail-actions button{flex:1}@media(min-width:650px){.cards{grid-template-columns:1fr 1fr}.photo{height:240px}.titleline h3{font-size:20px}.price{font-size:21px}.meta{font-size:15px}}@media(max-width:380px){.app{padding-left:12px;padding-right:12px}.head h1{font-size:26px}.sectiontitle h2{font-size:23px}.titleline h3{font-size:20px}.meta{font-size:15px}.price{font-size:21px}.searchrow{grid-template-columns:58px 1fr;gap:8px}}
</style></head><body>
<main class="app">
<header class="head"><div><h1>İstirahət vaxtıdır</h1><p>Günlük istirahət evləri</p></div><button class="iconbtn" onclick="openSettings()" aria-label="Ayarlar">⚙</button></header>
<div class="searchrow"><button class="filterbtn" onclick="openFilters()" aria-label="Filtrlər">☷</button><div class="search"><span>⌕</span><input id="query" placeholder="Ev, rayon, hovuz və s." oninput="render()"></div></div>
<div class="sectiontitle"><h2 id="listtitle">İstirahət evləri</h2><span id="total">Elanlar</span></div>
<section class="cards" id="cards"></section>
</main>
<nav class="bottomnav"><button class="navitem" onclick="home()"><span class="navicon">⌂</span><span>Ana səhifə</span></button><button class="addbtn" onclick="openAdd()" aria-label="Elan paylaş">＋</button><button class="navitem" onclick="savedPage()"><span class="navicon">♡</span><span>Yadda<br> saxlanılanlar</span></button></nav>
<div class="modalbg" id="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2 id="mtitle">Filtrlər</h2><button class="close" onclick="closeModal()">×</button></div><div id="mcontent"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const homes=[];
let custom=JSON.parse(localStorage.getItem("restCustomAds")||"[]"),archive=JSON.parse(localStorage.getItem("restAdArchive")||"[]"),saved=new Set(),onlySaved=false,filters={type:"",min:0,max:1000,pool:"",people:0,city:""},lang=localStorage.getItem("restLang")||"az",views=JSON.parse(localStorage.getItem("restViews")||"{}"),likes=JSON.parse(localStorage.getItem("restLikes")||"{}");
function getCount(obj,id){return Number(obj[id]||0)}function nextPhoto(id){let h=all().find(x=>x.id===id);if(!h)return;h._photoIndex=((h._photoIndex||0)+1)%((h.imgs&&h.imgs.length)?h.imgs.length:1);let im=document.getElementById("photo-"+id);if(im)im.src=(h.imgs&&h.imgs.length?h.imgs[h._photoIndex]:h.img)}function addView(id){views[id]=getCount(views,id)+1;localStorage.setItem("restViews",JSON.stringify(views));let el=document.getElementById("views-"+id);if(el)el.textContent=views[id]}
function archiveExpired(){const now=Date.now(),expired=custom.filter(h=>h.expiresAt&&h.expiresAt<=now);if(expired.length){expired.forEach(h=>{h.archiveReason='Müddəti bitib';h.archivedAt=now;archive.unshift(h)});custom=custom.filter(h=>!h.expiresAt||h.expiresAt>now);saveCustom();localStorage.setItem('restAdArchive',JSON.stringify(archive))}}
archiveExpired();
function all(){archiveExpired();return [...custom.filter(h=>h.active!==false&&(!h.expiresAt||h.expiresAt>Date.now())),...homes]}
function saveCustom(){localStorage.setItem("restCustomAds",JSON.stringify(custom))}
function dateText(ts){return new Date(ts).toLocaleDateString("az-AZ")}
function manageAds(){archiveExpired();document.getElementById("mtitle").textContent="Elanlarım";let box=document.getElementById("mcontent");let activeHtml=custom.length?custom.map(h=>`<div style="border:1px solid var(--line);border-radius:15px;padding:14px;margin:12px 0"><b>${esc(h.title)}</b><p style="margin:8px 0;color:var(--muted)">${esc(h.city)} · ${h.price} AZN/gün</p><p>Bitmə tarixi: <b>${h.expiresAt?dateText(h.expiresAt):"Təyin edilməyib"}</b></p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="submit" onclick="startRenew(${h.id})">Müddəti uzat</button><button class="submit" style="background:#a32d2d" onclick="deleteAd(${h.id})">Elanı sil</button></div></div>`).join(""):'<p>Aktiv elanınız yoxdur.</p>';let archiveHtml=archive.length?archive.map(h=>`<div style="border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0"><b>${esc(h.title)}</b><p style="margin:6px 0;color:var(--muted)">${esc(h.city)} · ${h.price} AZN/gün</p><small>Arxiv səbəbi: ${esc(h.archiveReason||'İstifadəçi silib')} · ${h.archivedAt?dateText(h.archivedAt):''}</small></div>`).join(""):'<p>Arxivdə hələ elan yoxdur.</p>';box.innerHTML=`<p style="color:var(--muted)">Elan paylaşıldıqdan sonra məlumatları, qiyməti və şəkilləri dəyişmək olmur. Yalnız müddəti ödənişlə uzada və ya silə bilərsiniz.</p><h3>Elanlarım</h3>${activeHtml}<hr><h3>Elan arxivi</h3><p style="color:var(--muted)">Müddəti bitən elanlar saytdan avtomatik götürülür və burada saxlanılır.</p>${archiveHtml}`;openModal()}
function startRenew(id){let h=custom.find(x=>x.id===id);if(!h)return;paymentScreen('renew',id,null)}
function paymentScreen(kind,id,ad){let isRenew=kind==='renew';let h=isRenew?custom.find(x=>x.id===id):ad;window.pendingPayment={kind,id,ad};document.getElementById('mtitle').textContent='Kartla ödəniş';document.getElementById('mcontent').innerHTML=`<div class="form"><p>Elanın ${isRenew?'müddətini uzatmaq':'paylaşılması'} üçün müddət seçin:</p><label style="display:flex;gap:10px;align-items:center;border:1px solid var(--line);padding:14px;border-radius:12px"><input type="radio" name="paydays" value="6" checked> <span><b>6 gün — 2 AZN</b></span></label><label style="display:flex;gap:10px;align-items:center;border:1px solid var(--line);padding:14px;border-radius:12px"><input type="radio" name="paydays" value="12"> <span><b>12 gün — 5 AZN</b></span></label><p style="color:var(--muted);font-size:13px">Kartla real ödəniş üçün ödəniş provayderi və server bağlantısı tələb olunur. Bu HTML demo versiyasında real pul tutulmur və kart məlumatı daxil etməyin.</p><button class="submit" type="button" onclick="demoPaymentConfirm()">Davam et — demo ödənişi</button><button class="submit" type="button" style="background:#777" onclick="manageAds()">Geri</button></div>`;openModal()}
function demoPaymentConfirm(){let p=window.pendingPayment;if(!p)return;let days=Number(document.querySelector('input[name="paydays"]:checked')?.value||6),amount=days===6?2:5;document.getElementById('mtitle').textContent='Ödəniş təsdiqi';document.getElementById('mcontent').innerHTML=`<div class="form"><p><b>${days} gün · ${amount} AZN</b></p><p style="color:#b42318">Bu yalnız demo təsdiqidir. Real kart ödənişi edilməyib.</p><p>Ödəniş sistemi qoşulmadan elanı həqiqi ödənişlə yayımlamaq mümkün deyil.</p><button class="submit" type="button" onclick="completeDemoPayment(${days})">Demo rejimində davam et</button><button class="submit" type="button" style="background:#777" onclick="paymentScreen('${p.kind}',${p.id||'null'},window.pendingPayment.ad)">Geri</button></div>`}
function completeDemoPayment(days){let p=window.pendingPayment;if(!p)return;if(p.kind==='new'){let ad=p.ad;ad.createdAt=Date.now();ad.expiresAt=Date.now()+days*86400000;ad.active=true;custom.unshift(ad);try{saveCustom()}catch(e){custom.shift();alert('Telefon yaddaşında yer çatmır. Şəkilləri azaldıb yenidən yoxlayın.');return}onlySaved=false;filters={type:'',min:0,max:1000,pool:'',people:0,city:''};document.getElementById('query').value='';closeModal();render();document.getElementById('listtitle').textContent='İstirahət evləri';window.scrollTo({top:0,behavior:'smooth'})}else{let h=custom.find(x=>x.id===p.id);if(h){h.expiresAt=Math.max(Date.now(),h.expiresAt||Date.now())+days*86400000;saveCustom()}manageAds();render()}window.pendingPayment=null}
function deleteAd(id){let h=custom.find(x=>x.id===id);if(!h)return;if(!confirm("Bu elanı silmək istəyirsiniz? Elan arxivdə saxlanılacaq."))return;custom=custom.filter(x=>x.id!==id);h.archiveReason='İstifadəçi silib';h.archivedAt=Date.now();archive.unshift(h);saveCustom();localStorage.setItem('restAdArchive',JSON.stringify(archive));manageAds();render()}
function render(){let q=document.getElementById('query').value.toLocaleLowerCase('az');let a=all().filter(h=>(!onlySaved||saved.has(h.id))&&(!q||(h.title+" "+h.city+" "+h.type+" "+h.features.join(" ")).toLocaleLowerCase('az').includes(q))&&(!filters.type||h.type===filters.type)&&h.price>=filters.min&&h.price<=filters.max&&(!filters.pool||h.features.includes(filters.pool))&&(!filters.people||h.people>=filters.people)&&(!filters.city||h.city.toLocaleLowerCase("az").includes(filters.city.toLocaleLowerCase("az"))));document.getElementById('total').textContent=a.length+" elan";document.getElementById('cards').innerHTML=a.length?a.map(h=>`<article class="card"><div class="photo"><img id="photo-${h.id}" onclick="openDetails(${h.id})" src="${(h.imgs&&h.imgs.length?h.imgs[0]:h.img)}" alt="${esc(h.title)}" onerror="this.style.display='none';this.parentElement.style.background='linear-gradient(135deg,#b6c9b5,#e8dfc9)'"><span class="source">${h.tag}${h.imgs&&h.imgs.length>1?` · ${h.imgs.length} şəkil ↻`:``}</span></div><div class="body"><div class="titleline"><h3>${esc(h.title)}</h3><button class="heart ${saved.has(h.id)?'on':''}" onclick="event.stopPropagation();toggle(${h.id})" aria-label="Yadda saxla">${saved.has(h.id)?'♥':'♡'}</button></div><div class="meta">${esc(h.city)} · ${h.people} nəfərlik</div><div class="price" role="button" tabindex="0" aria-label="${esc(h.title)} haqqında ətraflı məlumatı aç" onclick="openDetails(${h.id})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openDetails(${h.id})}">${h.price} AZN / günlük</div><div class="meta stats">👁 <span id="views-${h.id}">${getCount(views,h.id)}</span> baxış　 ♥ <span id="likes-${h.id}">${getCount(likes,h.id)}</span> bəyənmə</div></div></article>`).join(''):'<div class="empty">Uyğun elan tapılmadı.</div>'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toggle(id){saved.has(id)?saved.delete(id):saved.add(id);likes[id]=Math.max(0,getCount(likes,id)+(saved.has(id)?1:-1));localStorage.setItem("restLikes",JSON.stringify(likes));render()}
function home(){onlySaved=false;document.getElementById('listtitle').textContent='İstirahət evləri';render()}
function savedPage(){onlySaved=!onlySaved;document.getElementById('listtitle').textContent=onlySaved?'Yadda saxlanılanlar':'İstirahət evləri';render()}
function openModal(){document.getElementById('modalbg').classList.add('show')}function closeModal(){document.getElementById('modalbg').classList.remove('show')}
function openFilters(){document.getElementById('mtitle').textContent=tr('filter');document.getElementById('mcontent').innerHTML=`<form class="form" id="ff"><div><label>Ev növü / Тип дома / Property type</label><select name="type"><option value="">Hamısı / Все / All</option><option>Bağ evi</option><option>Dağ evi</option><option>A-frame ev</option><option>Villa</option><option>Kottec</option></select></div><div><label>Minimum qiymət (AZN)</label><select name="min"><option value="0">0 AZN</option><option value="50">50 AZN</option><option value="75">75 AZN</option><option value="100">100 AZN</option><option value="150">150 AZN</option><option value="200">200 AZN</option></select></div><div><label>Maksimum günlük qiymət (AZN)</label><select name="max"><option value="1000">Fərqi yoxdur</option><option value="50">50 AZN</option><option value="75">75 AZN</option><option value="100">100 AZN</option><option value="125">125 AZN</option><option value="150">150 AZN</option><option value="175">175 AZN</option><option value="200">200 AZN</option><option value="250">250 AZN</option><option value="300">300 AZN</option><option value="400">400 AZN</option><option value="500">500 AZN</option></select></div><div><label>Şəhər / rayon</label><input name="city" placeholder="Bakı, Qəbələ, Şamaxı..."></div><div><label>Minimum nəfər sayı</label><select name="people"><option value="0">Fərqi yoxdur</option><option value="2">2+</option><option value="4">4+</option><option value="6">6+</option><option value="8">8+</option><option value="10">10+</option></select></div><div><label>İmkanlar</label><select name="pool"><option value="">Fərqi yoxdur</option><option>Hovuz</option><option>Manqal</option><option>Dağ mənzərəsi</option></select></div><button class="submit">Nəticələri göstər</button><button type="button" class="submit" style="background:#777" id="resetfilters">Filtrləri sıfırla</button></form>`;document.getElementById('ff').onsubmit=e=>{e.preventDefault();let d=new FormData(e.target);filters={type:d.get('type'),min:+d.get('min'),max:+d.get('max'),pool:d.get('pool'),people:+d.get('people'),city:d.get('city').trim()};closeModal();render()};document.getElementById('resetfilters').onclick=()=>{filters={type:'',min:0,max:1000,pool:'',people:0,city:''};closeModal();render()};openModal()}
function infoContent(){const sections=lang==='ru'?[
['О сайте','Платформа помогает находить дома и места для отдыха на сутки, просматривать фотографии, цены и сведения об объектах.'],
['Как это работает?','Просмотрите объявления, воспользуйтесь поиском и фильтрами. Нажмите на фотографию или цену, чтобы открыть подробности и доступные контакты.'],
['Правила размещения объявлений','Указывайте достоверную информацию, актуальную цену и действующий контактный номер. Публикуйте только фотографии, которые разрешено использовать. Запрещены обман, незаконные предложения и чужие личные данные без разрешения.'],
['Оплата и возврат','Стоимость размещения: 6 дней — 2 AZN, 12 дней — 5 AZN. При продлении объявления применяются те же тарифы. Онлайн-оплата пока не подключена, поэтому не вводите данные банковской карты. До запуска оплаты пользователь должен увидеть итоговую сумму и условия возврата.'],
['Политика конфиденциальности','Данные аккаунта и объявлений обрабатываются для предоставления функций сайта и управления публикациями. Пользователь должен указывать только необходимые сведения и не публиковать чужие персональные данные без разрешения. Не передавайте пароль другим лицам. Настоящий текст следует применять вместе с фактическими настройками хранения данных и требованиями законодательства.'],
['Пользовательское соглашение','Пользователь несёт ответственность за достоверность объявления, законность предложения и наличие права сдавать объект в аренду. Запрещены мошенничество, дискриминация, незаконные предложения, вводящие в заблуждение цены и публикация персональных данных третьих лиц без согласия. Администрация вправе проверять, скрывать или удалять объявления, нарушающие правила.'],
['Частые вопросы','Как найти дом? Используйте поиск и фильтры. Как посмотреть контакты? Откройте фотографию или строку цены объявления. Как продлить объявление? Откройте «Настройки» → «Мои объявления и управление сроком».'],
['Связаться с нами','По вопросам работы сайта, жалобам на объявление и предложениям по улучшению сервиса используйте официальный канал связи, указанный владельцем сайта. Необходимо добавить действующий адрес электронной почты или номер поддержки перед публичным запуском.']
]:lang==='en'?[
['About the site','This platform helps people discover holiday homes, view photos, prices and property details for daily stays.'],
['How does it work?','Browse listings or use search and filters. Tap a photo or price to view details and any available contact information.'],

async function signedImageUrls(paths){
  const out=[];
  for(const path of (paths||[])){
    if(/^https?:\/\//i.test(path)){out.push(path);continue;}
    const {data,error}=await sbClient.storage.from("elan-sekiller").createSignedUrl(path,60*60*24*5);
    if(!error && data?.signedUrl) out.push(data.signedUrl);
  }
  return out;
}

async function uploadAdPhotos(files,userId){
  const paths=[];
  for(const file of files){
    if(!file.type.startsWith("image/")) throw new Error("Yalnız şəkil faylları yüklənə bilər.");
    if(file.size>5*1024*1024) throw new Error("Hər şəkil 5 MB-dan kiçik olmalıdır.");
    const ext=(file.type==="image/png"?"png":file.type==="image/webp"?"webp":"jpg");
    const path=`${userId}/${crypto.randomUUID()}.${ext}`;
    const {error}=await sbClient.storage.from("elan-sekiller").upload(path,file,{contentType:file.type,upsert:false});
    if(error) throw error;
    paths.push(path);
  }
  return paths;
}
async function sendListingToSupabase(ad,files,days=6){
  await refreshSession();
  if(!sbSession){showAuth("add");return;}
  const paths=await uploadAdPhotos(files,sbSession.user.id);
  const images=paths.slice();
  if(!images.length && ad.img) images.push(ad.img);
  const payload={owner_id:sbSession.user.id,title:ad.title,description:ad.description,
    location:ad.city,price:ad.price,phone:ad.phone,images,status:"pending",
    duration_days:days,type:ad.type,people:ad.people,features:ad.features||[]};
  const {error}=await sbClient.from("listings").insert(payload);
  if(error) throw error;
  document.getElementById("mtitle").textContent="Elan göndərildi";
  document.getElementById("mcontent").innerHTML=`<div class="form"><p>Elanınız admin təsdiqinə göndərildi.</p><p style="color:var(--muted)">Təsdiqlənənədək elan ümumi siyahıda görünməyəcək. Hazırkı mərhələdə real kart ödənişi qoşulmayıb.</p><button class="submit" onclick="closeModal()">Bağla</button></div>`;
  await loadMyListings();
}
let myListings=[];
async function loadMyListings(){
  if(!sbSession)return;
  const {data,error}=await sbClient.from("listings").select("*").eq("owner_id",sbSession.user.id).order("created_at",{ascending:false});
  if(!error) myListings=data||[];
}
async function manageAds(){
  await refreshSession();
  if(!sbSession){showAuth("manage");return;}
  await loadMyListings();
  document.getElementById("mtitle").textContent="Elanlarım";
  document.getElementById("mcontent").innerHTML=`<div class="form">
    <p style="color:var(--muted)">Elanlarınız hesabınızla əlaqələndirilir. Təsdiq gözləyən elanlar yalnız admin təsdiqindən sonra yayımlanır.</p>
    ${myListings.length?myListings.map(h=>`<div class="info-item" style="padding:14px"><b>${esc(h.title)}</b><p>${esc(h.location||"")} · ${h.price} AZN/gün</p><p>Status: <b>${h.status==="approved"?"Təsdiqlənib":h.status==="rejected"?"Rədd edilib":"Təsdiq gözləyir"}</b></p><button class="submit" style="background:#9b3030" onclick="deleteRemoteListing('${h.id}')">Elanı sil</button></div>`).join(""):'<p>Hələ elanınız yoxdur.</p>'}
    ${sbIsAdmin?'<button class="submit" onclick="openAdminPanel()">Admin paneli — elan təsdiqi</button>':''}
    <button class="submit" style="background:#666" onclick="sbClient.auth.signOut().then(()=>{refreshSession();closeModal();})">Hesabdan çıx</button>
  </div>`;
  openModal();
}
async function deleteRemoteListing(id){
  if(!confirm("Bu elanı silmək istəyirsiniz?"))return;
  const {error}=await sbClient.from("listings").delete().eq("id",id);
  if(error){alert("Elanı silmək mümkün olmadı: "+error.message);return;}
  await manageAds();await loadRemoteListings();
}
async function openAdminPanel(){
  await refreshSession();
  if(!sbSession||!sbIsAdmin){alert("Bu bölmə yalnız admin üçündür.");return;}
  const {data,error}=await sbClient.from("listings").select("*").eq("status","pending").order("created_at",{ascending:true});
  if(error){alert("Elanları almaq mümkün olmadı: "+error.message);return;}
  document.getElementById("mtitle").textContent="Admin — elan təsdiqi";
  document.getElementById("mcontent").innerHTML=`<div class="form">${data?.length?data.map(h=>`<div class="info-item" style="padding:14px"><b>${esc(h.title)}</b><p>${esc(h.location||"")} · ${h.price} AZN/gün</p><p>${esc(h.description||"")}</p><p>Telefon: ${esc(h.phone||"")}</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="submit" onclick="approveListing('${h.id}',${Number(h.duration_days)||6})">Təsdiqlə</button><button class="submit" style="background:#9b3030" onclick="rejectListing('${h.id}')">Rədd et</button></div></div>`).join(""):'<p>Təsdiq gözləyən elan yoxdur.</p>'}<button class="submit" style="background:#666" onclick="manageAds()">Geri</button></div>`;
  openModal();
}
async function approveListing(id,days){
  const now=new Date(),expires=new Date(now.getTime()+days*86400000);
  const {error}=await sbClient.from("listings").update({status:"approved",approved_at:now.toISOString(),expires_at:expires.toISOString()}).eq("id",id);
  if(error){alert("Təsdiq alınmadı: "+error.message);return;}
  await loadRemoteListings();await openAdminPanel();
}
async function rejectListing(id){
  const {error}=await sbClient.from("listings").update({status:"rejected"}).eq("id",id);
  if(error){alert("Dəyişiklik alınmadı: "+error.message);return;}
  await openAdminPanel();
}
